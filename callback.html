<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TikTok Authorization</title>
<style>
body{font-family:sans-serif;max-width:640px;margin:60px auto;padding:0 16px;line-height:1.6;color:#222;text-align:center}
.code-box{background:#f0f0f0;border-radius:8px;padding:16px;font-family:monospace;font-size:16px;word-break:break-all;margin:20px 0;user-select:all}
.err{color:#c0392b}
</style>
</head>
<body>
<h1>TikTok Authorization</h1>
<div id="content">Reading response...</div>

<script>
const params = new URLSearchParams(window.location.search);
const code = params.get("code");
const state = params.get("state");
const error = params.get("error");
const el = document.getElementById("content");

function clearEl(node) {
  while (node.firstChild) node.removeChild(node.firstChild);
}

clearEl(el);
if (error) {
  const p = document.createElement("p");
  p.className = "err";
  p.textContent = "Authorization failed: " + error;
  el.appendChild(p);
} else if (code) {
  const p1 = document.createElement("p");
  p1.textContent = "Copy this code and send it back:";
  const box = document.createElement("div");
  box.className = "code-box";
  box.textContent = code;
  const p2 = document.createElement("p");
  p2.style.fontSize = "13px";
  p2.style.color = "#666";
  p2.textContent = "state: " + state;
  el.appendChild(p1);
  el.appendChild(box);
  el.appendChild(p2);
} else {
  const p = document.createElement("p");
  p.className = "err";
  p.textContent = "No code found in the URL.";
  el.appendChild(p);
}
</script>
</body>
</html>
